<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文化祭・迷路連絡</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f4f6;color:#222}main{width:min(92%,560px);margin:30px auto}h1{text-align:center;font-size:28px;margin-bottom:24px}.card{background:white;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 14px rgba(0,0,0,.08)}label{display:block;font-weight:bold;margin:12px 0 6px}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:18px}button{width:100%;padding:16px;margin-top:10px;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}.primary{background:#222;color:white}.green{background:#1f9d55;color:white}.red{background:#d33;color:white}.role-buttons{display:flex;gap:10px}.role-buttons button{flex:1}.selected{outline:4px solid #222}.status{text-align:center;font-size:30px;font-weight:bold;padding:28px 10px;border-radius:16px;margin-bottom:16px}.status.ok{background:#d9f7df;color:#147a38}.status.busy{background:#ffe0e0;color:#a00}.connection{text-align:center;padding:12px;border-radius:10px;background:#fff3cd;margin-bottom:16px;font-weight:bold}.connected{background:#d9f7df;color:#147a38}.hidden{display:none}.small{font-size:13px;color:#666;line-height:1.6}#log{max-height:150px;overflow:auto;font-size:13px;color:#555;background:#f7f7f7;padding:10px;border-radius:8px}
  </style>
</head>
<body>
<main>
  <h1>迷路・入退場連絡</h1>
  <section id="setup" class="card">
    <p><b>入口と出口の2台で同じ部屋コードを使います。</b></p>
    <label for="room">部屋コード</label>
    <input id="room" value="hieron" maxlength="30" autocomplete="off">
    <label>この端末の役割</label>
    <div class="role-buttons">
      <button id="entryRole" onclick="chooseRole('entry')">入口</button>
      <button id="exitRole" onclick="chooseRole('exit')">出口</button>
    </div>
    <button class="primary" onclick="start()">接続する</button>
    <p class="small">2台とも同じコードを入力してください。<br>入口・出口はそれぞれ別の役割を選びます。</p>
  </section>
  <section id="app" class="hidden">
    <div id="connection" class="connection">接続準備中…</div>
    <div id="status" class="status busy">🔴 使用中</div>
    <div id="desc" class="card" style="text-align:center;font-weight:bold;">現在、迷路内に1組います。</div>
    <div id="entryPanel" class="card hidden">
      <h2>入口</h2><p>出口から「退出完了」の連絡が来たら、次の組を入場させます。</p>
      <button class="green" onclick="sendState('ok')">🟢 次の組を入れる</button>
      <button class="red" onclick="sendState('busy')">🔴 迷路使用中</button>
    </div>
    <div id="exitPanel" class="card hidden">
      <h2>出口</h2><p>参加者が全員出たら、入口に連絡します。</p>
      <button class="green" onclick="sendState('ok')">🟢 退出完了・次を入れてOK</button>
      <button class="red" onclick="sendState('busy')">🔴 まだ迷路内</button>
    </div>
    <div class="card"><button onclick="reconnect()">🔄 再接続</button><div id="log"></div></div>
  </section>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let peer=null,conn=null,role=null,state='busy',roomCode='',hostId='',retryTimer=null;
const $=id=>document.getElementById(id);
function log(t){const e=$('log');e.innerHTML='<div>'+new Date().toLocaleTimeString()+'　'+t.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>'+e.innerHTML}
function chooseRole(r){role=r;$('entryRole').classList.toggle('selected',r==='entry');$('exitRole').classList.toggle('selected',r==='exit')}
function render(){$('status').className='status '+(state==='ok'?'ok':'busy');$('status').textContent=state==='ok'?'🟢 次の組を入れてOK':'🔴 使用中';$('desc').textContent=state==='ok'?'次の組を入場させてください。':'現在、迷路内に1組います。';$('entryPanel').classList.toggle('hidden',role!=='entry');$('exitPanel').classList.toggle('hidden',role!=='exit')}
function setConnection(t,g=false){$('connection').textContent=t;$('connection').className='connection'+(g?' connected':'')}
function safeRoom(){return roomCode.replace(/[^a-zA-Z0-9_-]/g,'').slice(0,30)||'hieron'}
function start(){roomCode=$('room').value.trim()||'hieron';if(!role){alert('「入口」または「出口」を選んでください。');return}$('setup').classList.add('hidden');$('app').classList.remove('hidden');render();createConnection()}
function createConnection(){clearTimeout(retryTimer);if(peer){try{peer.destroy()}catch(e){}}conn=null;hostId='hieron-maze-'+safeRoom();if(role==='entry')createHost();else{setConnection('出口端末：入口を探しています…');log('入口端末を探しています');createGuestPeer()}}
function createHost(){setConnection('入口端末：接続待機中…');log('入口として待機しています');peer=new Peer(hostId);peer.on('open',()=>{setConnection('🟢 接続待機中（出口端末を待っています）',true);log('入口端末の待機開始')});peer.on('connection',c=>{log('出口端末から接続されました');setupConnection(c)});peer.on('error',e=>{log('接続エラー: '+e.type);setConnection(e.type==='unavailable-id'?'⚠️ 同じ部屋コードの入口端末がすでにあります':'⚠️ 接続エラー。再接続してください')})}
function createGuestPeer(){if(peer){try{peer.destroy()}catch(e){}}peer=new Peer();peer.on('open',()=>{log('通信準備完了');tryConnect()});peer.on('error',e=>{log('出口側エラー: '+e.type);scheduleRetry()})}
function tryConnect(){if(conn&&conn.open)return;setConnection('🟡 入口端末へ接続中…');try{const c=peer.connect(hostId,{reliable:true});setupConnection(c);setTimeout(()=>{if(!conn||!conn.open)scheduleRetry()},2500)}catch(e){scheduleRetry()}}
function scheduleRetry(){if(role!=='exit')return;clearTimeout(retryTimer);setConnection('🟡 入口端末を探しています…');retryTimer=setTimeout(()=>{if(!conn||!conn.open)tryConnect()},1500)}
function setupConnection(c){conn=c;c.on('open',()=>{clearTimeout(retryTimer);setConnection('🟢 2台が接続されています',true);log('2台の接続が完了しました');c.send({type:'state',state:state})});c.on('data',d=>{if(!d||d.type!=='state')return;state=d.state==='ok'?'ok':'busy';render();log(state==='ok'?'🟢 次の組を入れてOK':'🔴 迷路使用中')});c.on('close',()=>{conn=null;setConnection('🟡 接続が切れました。再接続中…');log('接続が切れました');if(role==='exit')scheduleRetry()});c.on('error',()=>{log('通信エラー');if(role==='exit')scheduleRetry()})}
function sendState(s){state=s;render();if(conn&&conn.open){conn.send({type:'state',state});log(state==='ok'?'🟢 OKを送信':'🔴 使用中を送信')}else{log('⚠️ 相手が未接続のため送信できません');if(role==='exit')scheduleRetry()}}
function reconnect(){log('再接続しています…');createConnection()}
chooseRole('entry');render();
</script>
</body>
</html>
